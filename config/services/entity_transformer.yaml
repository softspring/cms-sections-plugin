services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsSectionsPlugin\EntityListener\SectionVersionListener:
        tags:
            - { name: 'doctrine.orm.entity_listener', event: 'postLoad', entity: 'Softspring\CmsSectionsPlugin\Entity\SectionVersion',  priority: 10 } #, entity_manager: '%sfs_cms.entity_manager_name%' }
            - { name: 'doctrine.orm.entity_listener', event: 'preUpdate', entity: 'Softspring\CmsSectionsPlugin\Entity\SectionVersion',  priority: 10 } #, entity_manager: '%sfs_cms.entity_manager_name%' }
            - { name: 'doctrine.orm.entity_listener', event: 'prePersist', entity: 'Softspring\CmsSectionsPlugin\Entity\SectionVersion',  priority: 10 } #, entity_manager: '%sfs_cms.entity_manager_name%' }

    Softspring\CmsSectionsPlugin\EntityListener\SectionVersionCompileListener:
        tags:
            - { name: 'doctrine.orm.entity_listener', event: 'prePersist', entity: 'Softspring\CmsSectionsPlugin\Entity\SectionVersion',  priority: 11 } #, entity_manager: '%sfs_cms.entity_manager_name%' }
